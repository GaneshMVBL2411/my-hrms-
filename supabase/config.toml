# Minimal config so `supabase link` / `supabase db push` / `supabase functions deploy`
# work from a clean checkout.
#
# project_id must be set even when a command is given --project-ref: the CLI
# validates this file before it looks at the flag, and an empty value fails with
# "Missing required field in config: project_id".
project_id = "qsfoajiumdaxubrxnegg"

[db]
# Matches the live project (PostgreSQL 17.6).
major_version = 17

[functions.admin-users]
# Creating a login is HR-only; the function reads the caller's JWT to check that,
# so the platform must verify and forward it.
verify_jwt = true
