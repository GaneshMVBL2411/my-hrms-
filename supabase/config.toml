# Minimal config so `supabase link` / `supabase db push` / `supabase functions deploy`
# work from a clean checkout. `supabase link --project-ref <ref>` fills in project_id.
project_id = ""

[db]
# Matches the live project (PostgreSQL 17.6).
major_version = 17

[functions.admin-users]
# Creating a login is HR-only; the function reads the caller's JWT to check that,
# so the platform must verify and forward it.
verify_jwt = true
